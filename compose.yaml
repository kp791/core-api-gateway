version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8443:8443"
    volumes:
      # Hot-reload code in development, SELinux-safe
      - ./app:/app/app:z
      # Mount host certs (optional for dev)
      - ./certs:/certs:ro,z
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8443
      --ssl-keyfile /certs/key.pem
      --ssl-certfile /certs/cert.pem
      --ssl-keyfile-password ""
      --proxy-headers

